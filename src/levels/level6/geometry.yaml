# Level 6 geometry, built into $AC00-$ACFF and $AD80-$AD88
# by levelGeometry / levelStartExit (modules/game/level-geometry.macros.asm).
# YAML numbers: write 0xAA, not $AA.
#
# The level code changes it while it runs (code.asm):
# - platform 0 follows the lower platform: its left / right are rewritten
#   every frame (moveLedge);
# - ladder 9, at X 0x23, grows a rung (its bottom +6) for each mover shot,
#   and becomes 0x03..0x2B with the 6th (addRung);
# - torches 8..11, the chandelier's flames, stop when it falls (Y of torch 8
#   set to 0, in data-R5-AC00.asm).

start:
  x: 0x05
  y: 0x2B
  sprite: 0x0C
  facing: right

# the exit is past the screen: the level code moves the player onto it
# (checkLeave), once the chandelier fell and he walked to the top right
exit:
  arrow: { x: 0x7C, y: 0x2E, sprite: 0x25 }  # right arrow, top right
  win: { x: 0xC0, y: 0xC0 }

# the player stands on 'top', from left to right (max 31)
platforms:
  - { left: 0x02, right: 0x89, top: 0x7A }   # the lower platform (moveLedge)
  - { left: 0x12, right: 0x3E, top: 0x7C }
  - { left: 0x4C, right: 0x8A, top: 0x7C }
  - { left: 0x02, right: 0x0F, top: 0x52 }
  - { left: 0x18, right: 0x89, top: 0x52 }
  - { left: 0x01, right: 0x2C, top: 0x2A }
  - { left: 0x54, right: 0x8B, top: 0x2A }
  - { left: 0x02, right: 0x25, top: 0x02 }
  - { left: 0x02, right: 0x89, top: 0xA0 }

# climbable at x, from top to bottom (max 31)
ladders:
  - { x: 0x23, top: 0x7D, bottom: 0xA1 }
  - { x: 0x59, top: 0x7D, bottom: 0xA1 }
  - { x: 0x78, top: 0x7D, bottom: 0xA1 }
  - { x: 0x2E, top: 0x53, bottom: 0x7D }
  - { x: 0x62, top: 0x53, bottom: 0x7D }
  - { x: 0x0C, top: 0x2B, bottom: 0x53 }
  - { x: 0x6A, top: 0x2B, bottom: 0x53 }
  - { x: 0x7C, top: 0x2B, bottom: 0x53 }
  - { x: 0x1C, top: 0x2B, bottom: 0x53 }
  - { x: 0x23, top: 0x17, bottom: 0x1D }     # built rung by rung (addRung)

# block left/right moves at x, for the player's feet at y (max 15)
walls:
  - { x: 0x02, y: 0xA1 }
  - { x: 0x82, y: 0xA1 }
  - { x: 0x82, y: 0x7D }
  - { x: 0x82, y: 0x53 }
  - { x: 0x4E, y: 0x51 }
  - { x: 0x35, y: 0x51 }
  - { x: 0x01, y: 0x53 }
  - { x: 0x01, y: 0x2B }
  - { x: 0x04, y: 0x03 }
