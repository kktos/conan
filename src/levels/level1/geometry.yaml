# Level 1 geometry, built into $AC00-$ACFF and $AD80-$AD88
# by levelGeometry / levelStartExit (modules/game/level-geometry.macros.asm).
# YAML numbers: write 0xAA, not $AA.

start:
  x: 0x70
  y: 0xA5
  sprite: 0x0B
  facing: left

exit:
  arrow: { x: 0x05, y: 0x03, sprite: 0x24 }  # arrow sprite shown at the exit
  win: { x: 0x00, y: 0x04 }                   # player position that ends the level

# the player stands on 'top', from left to right (max 31)
platforms:
  - { left: 0x00, right: 0x8B, top: 0xA4 }
  - { left: 0x00, right: 0x66, top: 0x80 }
  - { left: 0x1A, right: 0x37, top: 0x7A }
  - { left: 0x00, right: 0x3F, top: 0x56 }
  - { left: 0x00, right: 0x4C, top: 0x30 }
  - { left: 0x58, right: 0x77, top: 0x30 }
  - { left: 0x59, right: 0x75, top: 0x04 }
  - { left: 0x0A, right: 0x60, top: 0x0D }
  - { left: 0x00, right: 0x0D, top: 0x03 }
  - { left: 0x7E, right: 0x8C, top: 0x47 }
  - { left: 0x77, right: 0x84, top: 0x80 }
  - { left: 0x7A, right: 0x88, top: 0x4D }

# climbable at x, from top to bottom (max 31)
ladders:
  - { x: 0x54, top: 0x81, bottom: 0xA5 }
  - { x: 0x2A, top: 0x57, bottom: 0x7B }
  - { x: 0x0A, top: 0x31, bottom: 0x57 }
  - { x: 0x63, top: 0x05, bottom: 0x31 }
  - { x: 0x80, top: 0x4E, bottom: 0x74 }

# block left/right moves at x, for the player's feet at y (max 15)
walls:
  - { x: 0x01, y: 0xA5 }
  - { x: 0x84, y: 0xA5 }
  - { x: 0x01, y: 0x81 }
  - { x: 0x19, y: 0x81 }
  - { x: 0x38, y: 0x81 }
  - { x: 0x65, y: 0x81 }
  - { x: 0x01, y: 0x57 }
  - { x: 0x01, y: 0x31 }
  - { x: 0x6E, y: 0x31 }
  - { x: 0x59, y: 0x0E }
  - { x: 0x0B, y: 0x0E }
  - { x: 0x8A, y: 0x4A }
  - { x: 0x82, y: 0x81 }
  - { x: 0x81, y: 0x4E }
