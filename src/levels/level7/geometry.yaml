# Level 7 geometry, built into $AC00-$ACFF and $AD80-$AD88
# by levelGeometry / levelStartExit (modules/game/level-geometry.macros.asm).
# YAML numbers: write 0xAA, not $AA.
#
# The level code changes it while it runs (code.asm):
# - platform 7 is the bridge at the left: written with a top of 0 (off),
#   it ends the list; setBridgeLedge writes its top, 0x7B, while the
#   bridge is there, and 0 again when it goes.
# - checkFellOff moves the exit onto the player when he falls off the
#   screen (back to level 6); the final animation (final.asm) moves player
#   and exit to (0xE0, 0xE0): level 8.

start:
  x: 0x80
  y: 0x28
  sprite: 0x0B
  facing: left

# no exit to walk to: the level code moves it (see above)
exit:
  arrow: { x: 0x86, y: 0x07, sprite: 0x25 }  # right arrow, top right
  win: { x: 0x00, y: 0x00 }

# the player stands on 'top', from left to right (max 31)
platforms:
  - { left: 0x0D, right: 0x40, top: 0x9D }
  - { left: 0x4D, right: 0x82, top: 0x9D }
  - { left: 0x0D, right: 0x3F, top: 0x7B }
  - { left: 0x4B, right: 0x89, top: 0x7B }
  - { left: 0x00, right: 0x21, top: 0x53 }   # the figure's ledge, where the gems are given
  - { left: 0x64, right: 0x78, top: 0x49 }   # the catapult's top
  - { left: 0x5F, right: 0x89, top: 0x27 }
  - { left: 0x00, right: 0x30, top: 0x7B, off: true }   # the bridge (setBridgeLedge)

# climbable at x, from top to bottom (max 31)
ladders:
  - { x: 0x19, top: 0x7C, bottom: 0x9E }
  - { x: 0x2C, top: 0x7C, bottom: 0x9E }
  - { x: 0x5B, top: 0x7C, bottom: 0x9E }
  - { x: 0x6E, top: 0x7C, bottom: 0x9E }
  - { x: 0x05, top: 0x54, bottom: 0x7C }
  - { x: 0x6D, top: 0x28, bottom: 0x4A }

# block left/right moves at x, for the player's feet at y (max 15)
walls:
  - { x: 0x7B, y: 0x9E }
  - { x: 0x84, y: 0x7C }
  - { x: 0x00, y: 0x54 }
  - { x: 0x1A, y: 0x54 }
  - { x: 0x64, y: 0x4A }
  - { x: 0x88, y: 0x4A }
  - { x: 0x83, y: 0x28 }
